notation:
  # Option 1: point at a full Notation config root containing
  # trustpolicy.json and truststore/
  configDir: /path/to/notation

  # Option 2: override individual paths if they live elsewhere
  # trustPolicyPath: /path/to/notation/trustpolicy.json
  # trustStorePath: /path/to/notation/truststore

runtime:
  tempDir: .cache/provavalidator/tmp
  syftCacheDir: .cache/provavalidator/syft
  cleanupTempOnSuccess: true
  cleanupTempOnFailure: true
  # Optional: refuse SBOM extraction when the temp filesystem is below a
  # minimum amount of free space. Disabled by default.
  # minFreeBytes: 10737418240

registries:
  ghcr.io:
    auth:
      type: token_or_anonymous
      tokenEnv: GHCR_TOKEN

  quay.io:
    auth:
      type: basic_or_anonymous
      usernameEnv: QUAY_USERNAME
      passwordEnv: QUAY_PASSWORD

  public.ecr.aws:
    auth:
      type: basic_or_anonymous
      username: AWS
      passwordEnv: ECR_PUBLIC_PASSWORD

  registry.internal.company.com:
    auth:
      type: basic
      username: ci-username
      passwordEnv: REGISTRY_PASSWORD

  index.docker.io:
    auth:
      type: docker
  

  my.private.registry:5000:
    auth: 
      type: token
      tokenEnv: PRIVATE_REGISTRY_TOKEN
